<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>我的进步 · 详情（新版）</title>
<style>
  body { margin: 0; width: 375px; background: #fff; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  .nav { height: 44px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; border-bottom: 1px solid #f4f6f9; }
  .page { padding: 10px 20px 40px; }

  .head { padding: 15px 0 17px; }
  .head-line { display: flex; align-items: baseline; }
  .head-num { font-size: 38px; font-weight: 700; letter-spacing: -0.75px; color: #1a1f26; }
  .head-arrow { margin-left: 8px; font-size: 19px; font-weight: 700; color: #0f9c8c; }
  .head-say { display: block; margin-top: 6px; font-size: 15px; line-height: 1.6; color: #4a515c; }

  .block { display: block; padding: 16px 0; border-top: 1px solid #eceff3; }
  .block-week { display: flex; align-items: center; }
  .block-title { display: block; font-size: 13px; color: #949aa3; margin-bottom: 3px; }
  .block-note { display: block; font-size: 12.5px; line-height: 1.7; color: #a8aeb8; }

  .week { display: flex; flex: 1; }
  .wk { display: flex; flex-direction: column; align-items: center; margin-right: 13px; }
  .wk-dot { width: 13px; height: 13px; border-radius: 50%; background: #f2f4f7; border: 1px solid #e6eaf0; box-sizing: border-box; }
  .wk.on .wk-dot { background: #0f9c8c; border-color: #0f9c8c; }
  .wk.today .wk-dot { box-shadow: 0 0 0 2.5px rgba(15,156,140,0.16); }
  .wk-label { margin-top: 4px; font-size: 11px; color: #b3b9c2; }
  .wk.on .wk-label { color: #0f9c8c; }
  .week-meta { font-size: 12px; color: #949aa3; }

  .chart { width: 100%; height: 160px; margin-top: 8px; }

  .row { display: flex; align-items: baseline; padding: 7px 0; }
  .row-name { flex: 1; font-size: 14.5px; color: #1a1f26; }
  .row-count { font-size: 11.5px; color: #b3b9c2; margin-right: 12px; }
  .row-val { font-size: 16px; font-weight: 600; color: #1a1f26; min-width: 53px; text-align: right; }
  .row-delta { font-size: 12.5px; font-weight: 600; min-width: 38px; text-align: right; }
  .row-delta.up { color: #0f9c8c; }
  .row-delta.down { color: #c47b1f; }

  .block-last { display: flex; align-items: baseline; }
  .total-num { font-size: 20px; font-weight: 700; color: #1a1f26; }
  .total-item { margin-left: 4px; font-size: 12.5px; color: #4a515c; }
  .total-sep { margin: 0 10px; color: #d3d7de; font-size: 12.5px; }

  .cta { margin-top: 24px; padding: 15px 0; border-radius: 8px; text-align: center; font-size: 16px; font-weight: 600; color: #fff; background: #0f9c8c; }
  .foot { display: block; margin-top: 14px; font-size: 11.5px; line-height: 1.75; color: #a8aeb8; }
</style>
</head>
<body>
  <div class="nav">我的进步</div>
  <div class="page">

    <div class="head">
      <div class="head-line">
        <span class="head-num">68%</span>
        <span class="head-arrow">↑</span>
      </div>
      <span class="head-say">比上周稳了 6 个百分点</span>
    </div>

    <div class="block block-week">
      <div class="week">
        <div class="wk on"><div class="wk-dot"></div><span class="wk-label">一</span></div>
        <div class="wk"><div class="wk-dot"></div><span class="wk-label">二</span></div>
        <div class="wk on today"><div class="wk-dot"></div><span class="wk-label">三</span></div>
        <div class="wk on"><div class="wk-dot"></div><span class="wk-label">四</span></div>
        <div class="wk on"><div class="wk-dot"></div><span class="wk-label">五</span></div>
        <div class="wk"><div class="wk-dot"></div><span class="wk-label">六</span></div>
        <div class="wk"><div class="wk-dot"></div><span class="wk-label">日</span></div>
      </div>
      <span class="week-meta">4 / 7 天</span>
    </div>

    <div class="block">
      <span class="block-title">稳定率走势</span>
      <svg class="chart" viewBox="0 0 335 160" preserveAspectRatio="none">
        <line x1="34" y1="14" x2="335" y2="14" stroke="#f2f4f7" stroke-width="1"/>
        <line x1="34" y1="61" x2="335" y2="61" stroke="#f2f4f7" stroke-width="1"/>
        <line x1="34" y1="108" x2="335" y2="108" stroke="#f2f4f7" stroke-width="1"/>
        <line x1="34" y1="154" x2="335" y2="154" stroke="#e6eaf0" stroke-width="1"/>
        <text x="28" y="18" text-anchor="end" font-size="9" fill="#c0c5cd">100</text>
        <text x="28" y="65" text-anchor="end" font-size="9" fill="#c0c5cd">70</text>
        <text x="28" y="112" text-anchor="end" font-size="9" fill="#c0c5cd">40</text>
        <path d="M34 120 L67 112 L100 116 L133 96 L166 88 L199 92 L232 74 L265 62 L298 52 L335 44 L335 154 L34 154 Z"
              fill="rgba(15,156,140,0.08)" stroke="none"/>
        <path d="M34 120 L67 112 L100 116 L133 96 L166 88 L199 92 L232 74 L265 62 L298 52 L335 44"
              fill="none" stroke="#0f9c8c" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
        <text x="34" y="150" font-size="9" fill="#c0c5cd">10/18</text>
        <text x="335" y="150" text-anchor="end" font-size="9" fill="#c0c5cd">10/30</text>
      </svg>
    </div>

    <div class="block">
      <span class="block-title">各项训练</span>
      <div class="row"><span class="row-name">射击</span><span class="row-count">12 次</span><span class="row-val">74%</span><span class="row-delta up">+5</span></div>
      <div class="row"><span class="row-name">节奏训练</span><span class="row-count">9 次</span><span class="row-val">66%</span><span class="row-delta up">+3</span></div>
      <div class="row"><span class="row-name">接水果</span><span class="row-count">6 次</span><span class="row-val">61%</span><span class="row-delta"></span></div>
      <div class="row"><span class="row-name">走钢丝</span><span class="row-count">3 次</span><span class="row-val">58%</span><span class="row-delta down">-4</span></div>
    </div>

    <div class="block block-last">
      <span class="total-num">47</span><span class="total-item">次训练</span>
      <span class="total-sep">·</span>
      <span class="total-num">735</span><span class="total-item">分钟</span>
    </div>

    <div class="cta">继续训练</div>
    <span class="foot">稳定率 = 身体待在目标范围内的时长占比，不是游戏分数。难度调高时暂时下降是正常的。</span>

  </div>
</body>
</html>
