<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>零点标定 · 分布置顶</title>
<style>
  body { margin: 0; width: 375px; background: #fff; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  .nav { height: 44px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; border-bottom: 1px solid #f4f6f9; }
  .page { padding: 8px 16px 24px; }

  .bar { display: flex; align-items: center; padding: 10px 0 14px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #bdbfc4; margin-right: 8px; }
  .dot.on { background: #0f9c8c; }
  .bar-text { font-size: 12.5px; color: #4a4f55; }
  .link { margin-left: auto; font-size: 12.5px; color: #0f9c8c; }

  .h1 { font-size: 19px; font-weight: 600; color: #1a1d21; margin: 4px 0 14px; }

  .readout { display: flex; background: #f7f9fa; border-radius: 8px; padding: 18px 0; }
  .ro-item { flex: 1; text-align: center; }
  .ro-num { font-size: 31px; font-weight: 500; color: #1a1d21; line-height: 1.1; font-family: "SF Mono", Menlo, monospace; }
  .ro-unit { font-size: 14px; color: #8b9198; margin-left: 2px; }
  .ro-label { font-size: 11.5px; color: #8b9198; margin-top: 5px; }
  .ro-sep { width: 1px; background: #e8ecf0; margin: 4px 0; }

  .badge { display: flex; align-items: center; padding: 9px 12px; border-radius: 6px; font-size: 12.5px; margin: 12px 0 0; background: #eef8f6; color: #0b7a6a; }
  .badge-dot { width: 6px; height: 6px; border-radius: 50%; margin-right: 7px; background: #0f9c8c; }

  .zero { margin: 14px 0 12px; }
  .zero-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .zero-title { font-size: 14px; font-weight: 600; color: #1a1f26; }
  .zero-hint { font-size: 11.5px; color: #949aa3; }
  .chart-zero { height: 200px; background: #fafbfc; border-radius: 6px; }

  .legend { display: flex; gap: 16px; margin-top: 8px; }
  .lg { display: flex; align-items: center; font-size: 11px; color: #71767c; }
  .sw { width: 12px; height: 3px; border-radius: 2px; margin-right: 5px; }
  .sw-sd { background: rgba(15,156,140,0.35); height: 8px; }
  .sw-range { background: rgba(47,123,214,0.25); height: 8px; }
  .sw-dot { width: 5px; height: 5px; border-radius: 50%; background: #e8845a; margin-right: 5px; }

  .stats { display: flex; margin-top: 10px; border-top: 1px solid #f0f2f5; padding-top: 10px; }
  .st { flex: 1; text-align: center; }
  .st-n { font-size: 14px; color: #1a1d21; font-family: "SF Mono", Menlo, monospace; }
  .st-n.ok { color: #0f9c8c; }
  .st-l { font-size: 10px; color: #949aa3; margin-top: 3px; }

  .btn-primary { height: 48px; line-height: 48px; text-align: center; background: #0f9c8c; color: #fff; font-size: 16px; border-radius: 8px; margin-top: 6px; }
  .btn-plain { margin-top: 10px; text-align: center; font-size: 13.5px; color: #71767c; padding: 8px 0; }

  .fold { display: flex; align-items: center; padding: 13px 0; border-top: 1px solid #ececf0; font-size: 14px; color: #4a4f55; margin-top: 6px; }
  .note { font-size: 12px; line-height: 1.7; color: #9aa1ad; margin-top: 10px; }
</style>
</head>
<body>
  <div class="nav">零点标定</div>
  <div class="page">

    <div class="bar">
      <div class="dot on"></div>
      <span class="bar-text">已连接 · 接收数据中</span>
      <span class="link">重新扫描</span>
    </div>

    <div class="h1">零点标定</div>

    <div class="readout">
      <div class="ro-item"><div class="ro-num">0.62<span class="ro-unit">°</span></div><div class="ro-label">Roll 前后</div></div>
      <div class="ro-sep"></div>
      <div class="ro-item"><div class="ro-num">-0.31<span class="ro-unit">°</span></div><div class="ro-label">Pitch 左右</div></div>
    </div>

    <div class="badge"><div class="badge-dot"></div>已标定，所有页面共用这个零点</div>

    <div class="zero">
      <div class="zero-head">
        <span class="zero-title">标定时的姿态分布</span>
        <span class="zero-hint">横轴 Roll，纵轴 Pitch</span>
      </div>
      <svg class="chart-zero" viewBox="0 0 343 200" preserveAspectRatio="none">
        <text x="10" y="16" font-size="9" fill="#b4b2a9">Pitch</text>
        <text x="333" y="16" text-anchor="end" font-size="9" fill="#b4b2a9">Roll</text>
        <line x1="26" y1="30" x2="26" y2="178" stroke="#e8ecf0" stroke-width="1"/>
        <line x1="26" y1="178" x2="330" y2="178" stroke="#e8ecf0" stroke-width="1"/>
        <line x1="26" y1="104" x2="330" y2="104" stroke="#f0f2f5" stroke-width="1"/>
        <line x1="178" y1="30" x2="178" y2="178" stroke="#f0f2f5" stroke-width="1"/>
        <text x="22" y="34" text-anchor="end" font-size="9" fill="#c0c5cd">0.6</text>
        <text x="22" y="108" text-anchor="end" font-size="9" fill="#c0c5cd">0.3</text>
        <text x="22" y="182" text-anchor="end" font-size="9" fill="#c0c5cd">0.0</text>
        <text x="26" y="192" font-size="9" fill="#c0c5cd">90.2</text>
        <text x="178" y="192" text-anchor="middle" font-size="9" fill="#c0c5cd">90.4</text>
        <text x="330" y="192" text-anchor="end" font-size="9" fill="#c0c5cd">90.6</text>
        <circle cx="178" cy="104" r="58" fill="rgba(47,123,214,0.10)" stroke="rgba(47,123,214,0.35)" stroke-width="1"/>
        <circle cx="178" cy="104" r="26" fill="rgba(15,156,140,0.16)" stroke="rgba(15,156,140,0.55)" stroke-width="1"/>
        <g fill="rgba(15,156,140,0.55)">
          <circle cx="170" cy="96" r="2.2"/><circle cx="186" cy="94" r="2.2"/><circle cx="166" cy="108" r="2.2"/>
          <circle cx="190" cy="110" r="2.2"/><circle cx="178" cy="88" r="2.2"/><circle cx="172" cy="116" r="2.2"/>
          <circle cx="196" cy="100" r="2.2"/><circle cx="160" cy="100" r="2.2"/><circle cx="182" cy="120" r="2.2"/>
          <circle cx="174" cy="102" r="2.2"/><circle cx="188" cy="86" r="2.2"/><circle cx="158" cy="114" r="2.2"/>
          <circle cx="198" cy="114" r="2.2"/><circle cx="164" cy="88" r="2.2"/><circle cx="180" cy="98" r="2.2"/>
          <circle cx="152" cy="106" r="2.2"/><circle cx="204" cy="98" r="2.2"/><circle cx="176" cy="122" r="2.2"/>
          <circle cx="186" cy="124" r="2.2"/><circle cx="156" cy="92" r="2.2"/>
        </g>
        <g stroke="#e8845a" stroke-width="1.2">
          <line x1="178" y1="92" x2="178" y2="116"/>
          <line x1="166" y1="104" x2="190" y2="104"/>
        </g>
        <circle cx="178" cy="104" r="3.6" fill="none" stroke="#e8845a" stroke-width="1.4"/>
      </svg>
      <div class="legend">
        <div class="lg"><span class="sw sw-sd"></span>1σ 范围</div>
        <div class="lg"><span class="sw sw-range"></span>最大抖动</div>
        <div class="lg"><span class="sw-dot"></span>零点</div>
      </div>
      <div class="stats">
        <div class="st"><div class="st-n">247</div><div class="st-l">采样点</div></div>
        <div class="st"><div class="st-n">0.28°</div><div class="st-l">前后抖动</div></div>
        <div class="st"><div class="st-n">0.21°</div><div class="st-l">左右抖动</div></div>
        <div class="st"><div class="st-n ok">0.09°</div><div class="st-l">标准差</div></div>
      </div>
    </div>

    <div class="btn-primary">重新标定零点</div>
    <div class="btn-plain">清除零点，恢复原始角度</div>

    <div class="fold">Roll / Pitch 实时曲线</div>

    <div class="note">标定就是把现在的姿势算作 0°。换佩戴方式或换人，重新点一次。</div>

  </div>
</body>
</html>
