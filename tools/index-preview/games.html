<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>游戏中心</title>
<style>
  body { margin: 0; width: 375px; background: #fff; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  .nav { height: 44px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; border-bottom: 1px solid #f4f6f9; }
  .page { padding: 4px 20px 40px; }

  .lead { padding: 13px 0 5px; }
  .lead-title { display: block; font-size: 20px; font-weight: 600; color: #1a1f26; letter-spacing: -0.25px; }
  .lead-desc { display: block; margin-top: 5px; font-size: 12.5px; line-height: 1.5; color: #949aa3; }

  .group { padding: 22px 0 7px; }
  .group-gap { padding-top: 26px; }
  .group-title { display: block; font-size: 14px; font-weight: 600; color: #1a1f26; }
  .group-hint { display: block; margin-top: 4px; font-size: 12px; color: #a8aeb8; }

  .row { display: flex; align-items: center; padding: 13px 2px; border-bottom: 1px solid #eceff3; }
  .row-icon { width: 24px; height: 24px; border-radius: 5px; margin-right: 12px; flex-shrink: 0; }
  .row-main { flex: 1; }
  .row-title { display: block; font-size: 16px; color: #1a1f26; }
  .row-desc { display: block; margin-top: 3px; font-size: 12px; line-height: 1.5; color: #949aa3; }
  .row-go { padding-left: 8px; font-size: 17px; color: #c8ccd4; }

  .tip { display: block; margin-top: 22px; font-size: 11.5px; line-height: 1.75; color: #a8aeb8; }
</style>
</head>
<body>
  <div class="nav">游戏</div>
  <div class="page">

    <div class="lead">
      <span class="lead-title">选一个开始</span>
      <span class="lead-desc">5 个游戏都用手上的传感器控制 · 身体动，画面才动</span>
    </div>

    <div class="group">
      <span class="group-title">静态保持</span>
      <span class="group-hint">站稳、控制住，身体别晃出范围</span>
    </div>
    <div class="row">
      <div class="row-icon" style="background:#5b8def"></div>
      <div class="row-main">
        <span class="row-title">射击</span>
        <span class="row-desc">保持身体在目标范围内瞄准得分</span>
      </div>
      <span class="row-go">›</span>
    </div>
    <div class="row">
      <div class="row-icon" style="background:#6bb8e8"></div>
      <div class="row-main">
        <span class="row-title">走钢丝</span>
        <span class="row-desc">动态平衡，保险绳容错</span>
      </div>
      <span class="row-go">›</span>
    </div>

    <div class="group group-gap">
      <span class="group-title">动态控制</span>
      <span class="group-hint">跟着目标移动身体，练重心转移</span>
    </div>
    <div class="row">
      <div class="row-icon" style="background:#e8913d"></div>
      <div class="row-main">
        <span class="row-title">赛车</span>
        <span class="row-desc">前后左右位移驾驶赛车，霓虹赛道</span>
      </div>
      <span class="row-go">›</span>
    </div>
    <div class="row">
      <div class="row-icon" style="background:#d4794f"></div>
      <div class="row-main">
        <span class="row-title">节奏训练</span>
        <span class="row-desc">随音乐节拍左右移动，接住落下的音符</span>
      </div>
      <span class="row-go">›</span>
    </div>
    <div class="row">
      <div class="row-icon" style="background:#5b8def"></div>
      <div class="row-main">
        <span class="row-title">接水果</span>
        <span class="row-desc">左右倾身移动果篮，把水果接进篮子</span>
      </div>
      <span class="row-go">›</span>
    </div>

    <span class="tip">训练前先在首页连接传感器并标定零点 —— 不标定，游戏里的判定会一直偏。</span>

  </div>
</body>
</html>
