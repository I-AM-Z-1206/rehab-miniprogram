<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>射击训练 · 页面预览</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1f26; overflow: hidden; }
  #phone {
    position: relative; width: 390px; height: 844px; margin: 0 auto;
    background: #070d1c; overflow: hidden;
    display: flex; flex-direction: column;
  }
  body.bare #phone { margin: 0; }
  /* 对应 pages/shoot/shoot.wxss（rpx 已按 390/750 折算） */
  .wrap { position: relative; width: 100%; height: 100vh; overflow: hidden; background: #070d1c; }
  .cv { display: block; width: 100%; height: 100%; }
  .boot {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #070d1c; color: rgba(206,226,244,.7); font-size: 12px;
  }
  .boot-dot { width: 14px; height: 14px; border-radius: 50%; background: #0f9c8c; opacity: .8; }
  .boot-text { margin-top: 10px; }
  #toast {
    position: absolute; left: 50%; bottom: 30%; transform: translateX(-50%);
    max-width: 70%; padding: 8px 14px; border-radius: 6px;
    background: rgba(0,0,0,.74); color: #fff; font-size: 13px; line-height: 1.4;
    opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="phone">
  <div class="wrap">
    <canvas id="gameCanvas" class="cv"></canvas>
    <div class="boot" id="boot">
      <div class="boot-dot"></div>
      <div class="boot-text">正在准备场景…</div>
    </div>
  </div>
  <div id="toast"></div>
</div>
<script src="bundle.js"></script>
</body>
</html>
